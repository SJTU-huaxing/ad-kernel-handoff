[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-kernel-ascend"
version = "0.1.0"
description = "Auditable amplitude-direction linear attention and Ascend experiments"
requires-python = ">=3.11"
dependencies = ["torch>=2.7", "numpy", "safetensors", "transformers>=4.45", "datasets", "pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

